name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Run pytest on Python 3.12
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
        # The parquet data files (data/nq_1m.parquet, data/es_1m.parquet) and
        # the proprietary SMT package are not present in CI.  Tests that depend
        # on them skip automatically (guarded by pytest.skip / try-except in
        # test_swing_smt_integration.py and the characterisation tests).
        # Unit, determinism, and graceful-fallback tests run unconditionally.
